[alembic]
script_location = backend/migrations
prepend_sys_path = .
# Overridden at runtime by LCIT_SIGN_DATABASE_URL (see backend/migrations/env.py).
sqlalchemy.url = postgresql+psycopg://lcit_sign:lcit_sign@localhost:5432/lcit_sign

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
