# The CrashTest stack, on top of docker-compose.yml (see crashtest/start.sh): its own database
# (whose name ends with _crashtest), the mock SSO wired as the SSO, and the flag that lets the
# dataset be loaded. Never used for a real installation.
services:
  postgres:
    environment:
      POSTGRES_DB: lcit_sign_crashtest

  api:
    environment:
      LCIT_SIGN_CRASHTEST: "true"
      LCIT_SIGN_DATABASE_URL: postgresql+psycopg://lcit_sign:${LCIT_SIGN_DB_PASSWORD:-crashtest-only-password}@postgres:5432/lcit_sign_crashtest
      LCIT_SIGN_OIDC_ISSUER: http://mock-oidc:8080
      LCIT_SIGN_OIDC_CLIENT_ID: lcit-sign-crashtest
      LCIT_SIGN_OIDC_CLIENT_SECRET: crashtest-only-client-secret
      LCIT_SIGN_BOOTSTRAP_ADMIN: ""
    volumes:
      - ./crashtest:/crashtest:ro
