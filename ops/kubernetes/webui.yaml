apiVersion: apps/v1
kind: Deployment
metadata:
  name: lcit-sign-webui
  namespace: lcit-sign
spec:
  replicas: 2
  selector:
    matchLabels: {app: lcit-sign-webui}
  template:
    metadata:
      labels: {app: lcit-sign-webui}
    spec:
      containers:
        - name: webui
          image: lcit-sign-webui:latest   # replace with your registry/tag
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 80, name: http}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
              add: [CHOWN, SETGID, SETUID, NET_BIND_SERVICE]   # nginx master/worker
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 20m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: lcit-sign-webui
  namespace: lcit-sign
spec:
  selector: {app: lcit-sign-webui}
  ports: [{port: 80, targetPort: http}]
