# Test-only services, layered on the main stack:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d postfix-test
#
# postfix-test is reachable from the API container as `postfix-test` and from
# the host on 127.0.0.1 only. It is not an open relay (see its Dockerfile).
services:
  postfix-test:
    build:
      context: docker/postfix-test
    image: lcit-sign-postfix-test:latest
    container_name: lcit-sign-postfix-test
    ports:
      - "127.0.0.1:2525:25"
      - "127.0.0.1:2587:587"
      - "127.0.0.1:2465:465"
      - "127.0.0.1:2526:2526"
    restart: "no"
