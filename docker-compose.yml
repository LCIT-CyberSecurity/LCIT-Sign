# Local development and integration stack.
#   docker compose up -d --build
#
# Expects a .env file beside this one (copy .env.example) holding
# LCIT_SIGN_DB_PASSWORD at minimum.
name: lcit-sign

services:
  postgres:
    image: postgres:16-alpine
    container_name: ${LCIT_SIGN_PREFIX:-lcit-sign}-postgres
    environment:
      POSTGRES_USER: lcit_sign
      POSTGRES_PASSWORD: ${LCIT_SIGN_DB_PASSWORD:-lcit_sign}
      POSTGRES_DB: lcit_sign
    volumes:
      - lcit-sign-postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "lcit_sign"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    image: ${LCIT_SIGN_PREFIX:-lcit-sign}-api:latest
    container_name: ${LCIT_SIGN_PREFIX:-lcit-sign}-api
    # Also on the converter's private network (it has no route out, and nothing else is on it).
    # And always reachable as "lcit-sign-api", the name the proxy is configured with, even when
    # the container is named otherwise (the throwaway stack of the end-to-end tests).
    networks:
      default:
        aliases: [lcit-sign-api]
      converter-net:
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LCIT_SIGN_ENVIRONMENT: ${LCIT_SIGN_ENVIRONMENT:-development}
      LCIT_SIGN_DATABASE_URL: postgresql+psycopg://lcit_sign:${LCIT_SIGN_DB_PASSWORD:-lcit_sign}@postgres:5432/lcit_sign
      LCIT_SIGN_LOG_LEVEL: INFO
      # Only the throwaway test stack turns this off (a browser suite signs in dozens of times).
      LCIT_SIGN_RATE_LIMIT_ENABLED: ${LCIT_SIGN_RATE_LIMIT_ENABLED:-true}
      # How often the worker runs (reminders, scheduled starts): the test stack
      # makes it quick.
      LCIT_SIGN_NOTIFICATION_WORKER_INTERVAL_SECONDS: ${LCIT_SIGN_NOTIFICATION_WORKER_INTERVAL_SECONDS:-30}
      LCIT_SIGN_SESSION_SECRET: ${LCIT_SIGN_SESSION_SECRET:-dev-only-insecure-secret-change-me}
      # http only for now (TLS/cert installer lands in a later phase).
      LCIT_SIGN_COOKIE_SECURE: ${LCIT_SIGN_COOKIE_SECURE:-false}
      LCIT_SIGN_PUBLIC_BASE_URL: ${LCIT_SIGN_PUBLIC_BASE_URL:-http://localhost:4180}
      # The real SSO (Microsoft Entra ID, Google, any OpenID Connect provider): all three set, or
      # none (then only the local sign-in exists). There is NO mock provider here: the mock SSO
      # belongs to the CrashTest stack (crashtest/), which sets these itself.
      LCIT_SIGN_OIDC_ISSUER: ${LCIT_SIGN_OIDC_ISSUER:-}
      LCIT_SIGN_OIDC_CLIENT_ID: ${LCIT_SIGN_OIDC_CLIENT_ID:-}
      # Only the look of the sign-in button: entra, google or generic (empty: read from the issuer).
      LCIT_SIGN_OIDC_PROVIDER: ${LCIT_SIGN_OIDC_PROVIDER:-}
      # Signing keys are derived from this (never persisted) — replace for
      # anything but local dev, and never commit a real value.
      LCIT_SIGN_MASTER_KEY: ${LCIT_SIGN_MASTER_KEY:-dev-only-insecure-master-key-change-me}
      LCIT_SIGN_OIDC_CLIENT_SECRET: ${LCIT_SIGN_OIDC_CLIENT_SECRET:-}
      # Secrets read from files in ./secrets (mounted below, read-only): they win over the
      # plain variables above, and never have to sit in .env. Create the folder yourself
      # first:  mkdir -p -m 700 secrets   (otherwise Docker creates it as root).
      LCIT_SIGN_OIDC_CLIENT_SECRET_FILE: ${LCIT_SIGN_OIDC_CLIENT_SECRET_FILE:-}
      LCIT_SIGN_MASTER_KEY_FILE: ${LCIT_SIGN_MASTER_KEY_FILE:-}
      LCIT_SIGN_SESSION_SECRET_FILE: ${LCIT_SIGN_SESSION_SECRET_FILE:-}
      # Email granted ADMIN at its SSO sign-in (empty: nobody). A clean installation starts with
      # the built-in local administrator only.
      LCIT_SIGN_BOOTSTRAP_ADMIN: ${LCIT_SIGN_BOOTSTRAP_ADMIN:-}
      # Word / LibreOffice files as input (.docx, .doc, .odt): the isolated converter below, started
      # with every stack. Set this to empty to accept PDFs only.
      LCIT_SIGN_CONVERTER_URL: ${LCIT_SIGN_CONVERTER_URL-http://converter:8090}
    volumes:
      - lcit-sign-data:/var/lib/lcit-sign
      - ${LCIT_SIGN_SECRETS_DIR:-./secrets}:/run/secrets/lcit-sign:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 15s
      retries: 6
    restart: unless-stopped

  webui:
    build:
      context: web
      dockerfile: Dockerfile
    image: ${LCIT_SIGN_PREFIX:-lcit-sign}-webui:latest
    container_name: ${LCIT_SIGN_PREFIX:-lcit-sign}-webui
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Name on the self-signed fallback certificate (used only when no
      # certificate is mounted under LCIT_SIGN_CERT_DIR).
      LCIT_SIGN_TLS_FQDN: ${LCIT_SIGN_FQDN:-localhost}
    ports:
      # Plain HTTP: development and integration only. Remove this line in
      # production and publish just the HTTPS port.
      - "127.0.0.1:${LCIT_SIGN_HTTP_PORT:-4180}:80"
      - "${LCIT_SIGN_HTTPS_BIND:-127.0.0.1}:${LCIT_SIGN_HTTPS_PORT:-4443}:443"
    volumes:
      # tls.crt / tls.key managed by scripts/certificate-installer.sh.
      # Read-only: the proxy can never alter its own key (spec §104).
      - ${LCIT_SIGN_CERT_DIR:-./certs}:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
    restart: unless-stopped

  # Converts Word / LibreOffice documents to PDF, in a container of its own: no network, no
  # database, no access to LCIT Sign's files, read-only, little memory and time. Part of every
  # stack (Word and LibreOffice files are accepted as input).
  converter:
    build:
      context: converter
    image: ${LCIT_SIGN_PREFIX:-lcit-sign}-converter:latest
    container_name: ${LCIT_SIGN_PREFIX:-lcit-sign}-converter
    networks: [converter-net]
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1g
    pids_limit: 200
    environment:
      CONVERTER_WORKDIR: /tmp
    expose:
      - "8090"
    restart: unless-stopped

  # Fake OpenID Connect provider for the CrashTest stack and the tests — never started unless that
  # profile is asked for (crashtest/start.sh does): docker compose --profile crashtest up.
  # "dev-sso" is the former name of the same profile.
  mock-oidc:
    build:
      context: mock_oidc
    image: ${LCIT_SIGN_PREFIX:-lcit-sign}-mock-oidc:latest
    container_name: ${LCIT_SIGN_PREFIX:-lcit-sign}-mock-oidc
    profiles: ["crashtest", "dev-sso"]
    # The secrets folder is private to you (mode 700): to read its providers file the mock runs
    # as your user. Set MOCK_OIDC_UID=$(id -u) in .env when you use real accounts.
    user: "${MOCK_OIDC_UID:-10001}"
    environment:
      MOCK_OIDC_ISSUER: http://mock-oidc:8080
      MOCK_OIDC_PUBLIC_BASE_URL: ${LCIT_SIGN_PUBLIC_BASE_URL:-http://localhost:4180}/mock-oidc
      # Real accounts (Entra, Google, LDAP) behind the mock sign-in: which ones, and their
      # secrets, come from a JSON file in ./secrets (outside Git; see docs/mock-sso-real-accounts.md).
      # Codes only ever go to the app itself.
      MOCK_OIDC_PROVIDERS_FILE: /run/secrets/lcit-sign/mock-oidc-providers.json
      MOCK_OIDC_ALLOWED_REDIRECTS: ${LCIT_SIGN_PUBLIC_BASE_URL:-http://localhost:4180}/api/auth/callback
    volumes:
      - ${LCIT_SIGN_SECRETS_DIR:-./secrets}:/run/secrets/lcit-sign:ro
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5
    restart: unless-stopped

networks:
  # No route to the outside and no other container: only the API can talk to the converter.
  converter-net:
    internal: true

volumes:
  # The keys never change (so the real stack keeps its data); only the final name follows the
  # prefix, which a throwaway stack (end-to-end tests) sets to keep apart.
  lcit-sign-postgres-data:
    name: ${LCIT_SIGN_PREFIX:-lcit-sign}-postgres-data
  lcit-sign-data:
    name: ${LCIT_SIGN_PREFIX:-lcit-sign}-data
