# Cache policy by path, declared once: locations below set no add_header of
# their own, so the security headers set at server level reach every
# response, including the HTML entry point.
map $uri $lcit_sign_cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    ~^/api(/|$) "";
    default     "no-store, must-revalidate";
}

# Plain HTTP: development, the container healthcheck and integration tests.
# Production publishes only the HTTPS port (see docker-compose.yml).
server {
    listen 80;
    server_name _;
    include /etc/nginx/lcit-sign/server-common.conf;
}

server {
    listen 443 ssl;
    server_name _;
    # ssl_certificate / ssl_certificate_key: written at start by
    # 40-lcit-sign-tls.sh (the mounted certificate, else a self-signed one).
    include /etc/nginx/lcit-sign/tls.conf;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1h;
    ssl_session_cache shared:LCITSIGN:5m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    include /etc/nginx/lcit-sign/server-common.conf;
}
