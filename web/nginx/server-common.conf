# Shared by the HTTP and HTTPS servers (included in both).
    root /usr/share/nginx/html;
    client_max_body_size 25m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; connect-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Cache-Control $lcit_sign_cache_control always;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://lcit-sign-api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The API sets these same headers itself (defense in depth for
        # anyone reaching it directly); hiding its copies here avoids
        # sending each one twice through nginx's own add_header below.
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Strict-Transport-Security;
    }

    # Dev-only mock SSO provider (profile dev-sso). Browser-facing only;
    # the API reaches it directly over the compose network for discovery
    # and token exchange. Resolved at request time via a variable: the
    # container may not exist when the profile is off, and a static
    # proxy_pass target would then fail nginx's startup DNS lookup.
    location /mock-oidc/ {
        resolver 127.0.0.11 valid=10s;
        set $mock_oidc_upstream http://mock-oidc:8080;
        # A variable-based proxy_pass does not strip the location prefix the
        # way a literal one does, so the rewrite does it explicitly before
        # the request reaches the upstream.
        rewrite ^/mock-oidc/(.*)$ /$1 break;
        proxy_pass $mock_oidc_upstream;
        proxy_set_header Host $host;
    }

    # Content-hashed build output: safe to cache forever.
    location /assets/ {
        try_files $uri =404;
    }

    # The entry point names the hashed bundles, so it must never be served stale.
    location = /index.html {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
