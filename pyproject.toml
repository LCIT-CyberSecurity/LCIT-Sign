[project]
name = "lcit-sign"
version = "0.1.0"
description = "Internal document signature and acknowledgement platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.25",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "cryptography>=43.0",
  "authlib>=1.3",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.5",
  # Runtime deps of mock_oidc/app.py, exercised in-process by tests/conftest.py.
  "python-multipart>=0.0.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
# S101: assert is fine in tests. B008: FastAPI's Depends() is meant to be
# called in argument defaults — that's the documented dependency-injection
# pattern, not the mutable-default-argument bug this rule targets.
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures assign literal placeholder secrets by design.
"tests/*" = ["S105", "S106"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true

[[tool.mypy.overrides]]
module = ["authlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests", "mock_oidc"]
asyncio_mode = "auto"
markers = [
  "postgres: tests requiring LCIT_SIGN_TEST_DATABASE_URL",
]

[tool.coverage.run]
source = ["src/lcit_sign"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lcit_sign"]
